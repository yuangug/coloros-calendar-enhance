plugins {
    id("com.android.application")
}

// 发布用签名：keystore.properties + keystore/ 只在发布者本机存在，不入库。
// 没有它们的机器照样能构建（release 自动退回 debug 签名）。
def keystorePropsFile = rootProject.file('keystore.properties')
def hasReleaseKey = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasReleaseKey) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace "com.lcodexs.coursealarm"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.yuangug.coursealarm"
        minSdk 26
        targetSdk 34
        versionCode 37
        versionName "0.9.10"
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // 开 R8 时入口类会被裁掉，必须保留（见 proguard-rules.pro）
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    if (project.hasProperty("coursealarmVerification")) {
        sourceSets.release.java.srcDir("src/deviceTest/java")
    }
    sourceSets.main.assets.srcDir(rootProject.file("licenses"))

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

dependencies {
    // 只参与编译：框架在运行时提供 io.github.libxposed.*，打进 APK 会类冲突
    compileOnly("io.github.libxposed:api:102.0.0")
}
